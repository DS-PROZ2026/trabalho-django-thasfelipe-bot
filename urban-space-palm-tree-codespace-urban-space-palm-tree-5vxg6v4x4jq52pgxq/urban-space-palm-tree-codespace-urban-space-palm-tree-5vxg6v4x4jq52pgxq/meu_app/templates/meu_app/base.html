<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestão de Ativos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; min-height: 100vh; }
        .navbar-brand { font-weight: 700; }
        .page-card { border: 0; border-radius: 1rem; box-shadow: 0 .35rem 1.2rem rgba(0,0,0,.07); }
        .metric-card { border: 0; border-radius: .9rem; }
        .table > :not(caption) > * > * { vertical-align: middle; }
        .auth-card { max-width: 520px; margin: 3rem auto; }
        .nav-link.active { font-weight: 600; }
    </style>
</head>
<body>
{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Gestão de Ativos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'lista_equipamentos' %}">Equipamentos</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'cadastrar_equipamento' %}">Novo equipamento</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'perfil' %}">Perfil</a></li>
            </ul>
            <span class="navbar-text me-3">Olá, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>
{% endif %}

<main class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
