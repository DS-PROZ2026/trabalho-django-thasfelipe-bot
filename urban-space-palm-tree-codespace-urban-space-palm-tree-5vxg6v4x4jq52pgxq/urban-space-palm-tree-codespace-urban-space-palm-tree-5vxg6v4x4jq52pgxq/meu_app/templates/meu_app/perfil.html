{% extends "meu_app/base.html" %}
{% block title %}Perfil | Gestão de Ativos{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card page-card"><div class="card-body p-4 p-md-5">
<h1 class="h3 mb-4">Meu perfil</h1>
<dl class="row mb-0">
<dt class="col-sm-4">Usuário</dt><dd class="col-sm-8">{{ user.username }}</dd>
<dt class="col-sm-4">E-mail</dt><dd class="col-sm-8">{{ user.email|default:"Não informado" }}</dd>
<dt class="col-sm-4">Data de cadastro</dt><dd class="col-sm-8">{{ user.date_joined|date:"d/m/Y H:i" }}</dd>
</dl>
</div></div></div></div>
{% endblock %}
